name: Chain Proxy Windows Build

on:
  push:
    branches:
      - feature/chain-proxy-residential
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Apply chain proxy patch
        run: python tool/apply_chain_proxy_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format patched sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Chain proxy tests
        run: flutter test test/common/chain_proxy_test.dart --reporter expanded

      - name: Build Windows x64
        run: dart setup.dart windows --arch amd64 -v

      - name: Upload Windows build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-chain-proxy-windows-amd64
          path: |
            dist/**
          if-no-files-found: warn
          retention-days: 14
