name: Chain Proxy Windows Build

on:
  push:
    branches:
      - feature/chain-proxy-residential
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Windows landing-chain parity tests
        run: flutter test test/common/windows_proxy_chain_test.dart --reporter expanded

      - name: Shared landing-chain regression tests
        run: flutter test test/common/chain_proxy_test.dart --reporter expanded

      - name: Verify shared chain cannot touch profile files
        shell: pwsh
        run: |
          $files = @(
            'lib/common/chain_proxy.dart',
            'lib/models/chain_proxy.dart',
            'lib/views/proxies/chain_proxy.dart'
          )
          $forbidden = @(
            "import 'dart:io'",
            'profilesPath',
            'ProfileDao',
            'ProfilesAction',
            'deleteProfile',
            'removeProfile',
            'checkAndUpdateAndCopy'
          )
          foreach ($file in $files) {
            $text = Get-Content $file -Raw
            foreach ($term in $forbidden) {
              if ($text.Contains($term)) {
                throw "Forbidden profile mutation surface '$term' found in $file"
              }
            }
          }

      - name: Build Windows x64
        run: dart setup.dart windows -v

      - name: Upload Windows build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-chain-proxy-windows-amd64
          path: |
            dist/**
          if-no-files-found: warn
          retention-days: 14
