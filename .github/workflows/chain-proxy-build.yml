name: Chain Proxy Android + Windows Build

on:
  push:
    branches:
      - feature/chain-proxy-v0.8.98
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  verify:
    name: Verify chain proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Chain proxy tests
        run: >-
          flutter test
          test/common/chain_proxy_test.dart
          test/common/chain_dns_strict_test.dart
          --reporter expanded

  android:
    name: Android ARM64
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android ARM64
        run: dart setup.dart android --arch arm64 -v

      - name: Upload Android build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.8.98-chain-proxy-android-arm64
          path: |
            dist/**
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows AMD64
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows AMD64
        run: dart setup.dart windows -v

      - name: Upload Windows build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.8.98-chain-proxy-windows-amd64
          path: dist/**
          if-no-files-found: warn
          retention-days: 14
