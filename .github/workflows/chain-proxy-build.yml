name: Chain Proxy Android Build

on:
  push:
    branches:
      - feature/chain-proxy-residential
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Chain proxy tests
        run: flutter test test/common/chain_proxy_test.dart --reporter expanded

      - name: Build Android ARM64
        run: dart setup.dart android --arch arm64 -v

      - name: Upload Android build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-chain-proxy-android-arm64
          path: |
            dist/**
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14
